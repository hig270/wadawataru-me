# パスワードや API キーがコミットに紛れ込んでいないかを gitleaks で調べる
# ci.yml と分けているのは、文書だけの変更でも調べるため（ci.yml は文書だけの変更では動かない。秘密情報は文書にも紛れ込む）
name: Secret Scan

on:
  pull_request:
  push:
    branches: [master]

# 調べるだけなので、読み取りの権限だけにする
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # 更新するときは、公式リリースの checksums.txt の値と一緒に変える
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 既定では最新のコミットしか取得しないので、履歴全体を取得する
          fetch-depth: 0
          # 調べるだけで push しないので、認証情報を残さない
          persist-credentials: false
      # 外部の Action を増やさず公式のバイナリを使う。差し替えられていないことをチェックサムで確かめてから展開する
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      # 公開リポジトリは Actions のログも誰でも読めるので、--redact で秘密情報をログに出さない
      # --verbose でファイルと行を表示する（なければ件数しか出ない）
      # 見つかると終了コード 1 になり、このジョブが失敗する
      - name: Scan full history
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --verbose --no-banner'
